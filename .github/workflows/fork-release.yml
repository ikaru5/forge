# Builds the extension for a vX.Y.Z tag and publishes it as a GitHub release,
# which updater/forge-updater installs from.
name: fork-release
permissions:
  contents: write
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          # "make build" lists contributors from git shortlog
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext make zip jq libglib2.0-bin

      - name: Build
        run: make build

      - name: Stamp version into metadata.json
        run: |
          # vX.Y.Z -> X*10000 + Y*100 + Z, must match updater/forge-updater.
          # Staying above the extensions.gnome.org version (89) keeps the
          # GNOME Extensions app from "updating" back to upstream.
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Tag must be vX.Y.Z"; exit 1; }
          major=$((10#${BASH_REMATCH[1]})) minor=$((10#${BASH_REMATCH[2]})) patch=$((10#${BASH_REMATCH[3]}))
          ((major >= 1 && minor < 100 && patch < 100)) || { echo "Need major >= 1, minor/patch < 100"; exit 1; }
          jq --argjson code $((major * 10000 + minor * 100 + patch)) \
             --arg name "${GITHUB_REF_NAME#v}" \
             --arg url "https://github.com/${GITHUB_REPOSITORY}" \
             '.version = $code | ."version-name" = $name | .url = $url' \
             temp/metadata.json > temp/metadata.json.new
          mv temp/metadata.json.new temp/metadata.json
          cat temp/metadata.json

      - name: Package
        run: |
          (cd temp && zip -qr "../forge@jmmaranan.com.zip" .)
          sha256sum "forge@jmmaranan.com.zip" > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "forge@jmmaranan.com.zip" SHA256SUMS \
            --verify-tag --generate-notes --title "Forge $GITHUB_REF_NAME"
